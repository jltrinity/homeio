services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOMEIO_VERSION: ${HOMEIO_VERSION:-dev}
      HOMEIO_SECRET_KEY: ${HOMEIO_SECRET_KEY:?Set HOMEIO_SECRET_KEY in Coolify}
      HOMEIO_DATABASE: /data/homeio.sqlite3
      HOMEIO_ALLOWED_HOSTS: ${HOMEIO_ALLOWED_HOSTS:?Set HOMEIO_ALLOWED_HOSTS in Coolify}
      HOMEIO_COOKIE_SECURE: "true"
      HOMEIO_HTTPS: "true"
      HOMEIO_SESSION_HOURS: ${HOMEIO_SESSION_HOURS:-8}
    expose:
      - "8000"
    volumes:
      - homeio-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,os; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/health',headers={'Host':os.environ['HOMEIO_ALLOWED_HOSTS'].split(',')[0].strip()}); assert c.getresponse().status == 200"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s

volumes:
  homeio-data:
