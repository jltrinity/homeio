<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Homeio · Tu hogar, en cuentas{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/app.css">
  {% block scripts %}{% endblock %}
  <script src="/static/app.js" defer></script>
</head>
<body>
<a href="#main" class="visually-hidden-focusable skip-link">Saltar al contenido</a>
<header class="app-header">
  <div class="container-xxl py-3 d-flex flex-wrap gap-3 align-items-center justify-content-between">
    <div class="d-flex flex-wrap align-items-center gap-2">
      <a href="/" class="brand" aria-label="Homeio, inicio"><span class="brand-mark">h</span> homeio<span class="brand-dot">.</span></a>
      <span class="badge rounded-pill text-secondary bg-light border"><span class="visually-hidden">Versión </span>{{ app_version }}</span>
    </div>
    {% if session and session.user_id %}
    <nav class="main-nav d-flex flex-wrap gap-1" aria-label="Navegación principal">
      <a class="nav-item {{ 'selected' if path == '/' }}" href="/">Resumen</a>
      <a class="nav-item {{ 'selected' if path.startswith('/movements') }}" href="/movements">Movimientos</a>
      <a class="nav-item {{ 'selected' if path == '/catalogs/category' }}" href="/catalogs/category">Categorías</a>
      <a class="nav-item {{ 'selected' if path == '/catalogs/site' }}" href="/catalogs/site">Establecimientos</a>
    </nav>
    <form action="/logout" method="post" class="d-flex gap-2 align-items-center">
      <input type="hidden" name="csrf_token" value="{{ session.csrf }}">
      <span class="user-label">{{ session.username }}</span><button class="btn btn-outline-secondary btn-sm">Salir</button>
    </form>
    {% endif %}
  </div>
</header>
<main id="main" class="container-xxl py-4 py-lg-5">{% block content %}{% endblock %}</main>
<footer class="container-xxl py-4 footer d-flex flex-wrap justify-content-between gap-2"><span>homeio · Contabilidad del hogar</span><span>jlrb 2027</span></footer>
</body>
</html>
